<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19"/>
      <stop offset="40%" stop-color="#0c142c"/>
      <stop offset="80%" stop-color="#111c3d"/>
      <stop offset="100%" stop-color="#080e22"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <linearGradient id="streamGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="streamGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6"/>
    </linearGradient>

    <radialGradient id="glowLeft" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowRight" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.05); }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes packetFlow1 {
      0% { cx: 50; cy: 75; opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { cx: 1150; cy: 75; opacity: 0; }
    }
    @keyframes packetFlow2 {
      0% { cx: 100; cy: 285; opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { cx: 1100; cy: 285; opacity: 0; }
    }
    @keyframes packetFlow3 {
      0% { cx: 50; cy: 180; opacity: 0; }
      25% { opacity: 0.9; }
      75% { opacity: 0.9; }
      100% { cx: 1150; cy: 180; opacity: 0; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    .flow-path {
      stroke-dasharray: 20, 15;
      animation: flowLine 16s linear infinite;
    }
    .glow-aura {
      animation: pulseGlow 6s ease-in-out infinite;
      transform-origin: center;
    }
    .packet-1 {
      animation: packetFlow1 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .packet-2 {
      animation: packetFlow2 5.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      animation-delay: 1.2s;
    }
    .packet-3 {
      animation: packetFlow3 7s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      animation-delay: 2.5s;
    }
    .pill-item {
      animation: floatPill 4s ease-in-out infinite;
    }
    .pill-item-alt {
      animation: floatPill 5s ease-in-out infinite;
      animation-delay: 1.5s;
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .body-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
    }
    .badge-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 600;
      font-size: 11px;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)"/>

  <!-- Ambient Glows (Behind all content) -->
  <circle cx="240" cy="110" r="280" fill="url(#glowLeft)" class="glow-aura"/>
  <circle cx="980" cy="250" r="280" fill="url(#glowRight)" class="glow-aura"/>

  <!-- Subdued Background Grid Pattern -->
  <g opacity="0.08" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="40" x2="1200" y2="40"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="220" x2="1200" y2="220"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="340" x2="1200" y2="340"/>
    <line x1="100" y1="0" x2="100" y2="360"/>
    <line x1="250" y1="0" x2="250" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="550" y1="0" x2="550" y2="360"/>
    <line x1="700" y1="0" x2="700" y2="360"/>
    <line x1="850" y1="0" x2="850" y2="360"/>
    <line x1="1000" y1="0" x2="1000" y2="360"/>
    <line x1="1150" y1="0" x2="1150" y2="360"/>
  </g>

  <!-- Dynamic Data Pipeline Tracks (Background Layer) -->
  <g opacity="0.45">
    <!-- Stream track 1 -->
    <path d="M 0,75 L 350,75 C 450,75 500,45 600,45 L 850,45 C 950,45 1000,75 1200,75" 
          fill="none" stroke="url(#streamGrad1)" stroke-width="2.5" class="flow-path"/>
    
    <!-- Stream track 2 -->
    <path d="M 0,285 L 300,285 C 420,285 480,315 620,315 L 850,315 C 970,315 1020,285 1200,285" 
          fill="none" stroke="url(#streamGrad2)" stroke-width="2.5" class="flow-path"/>

    <!-- Center pulse track -->
    <path d="M 0,180 L 1200,180" 
          fill="none" stroke="#38bdf8" stroke-opacity="0.1" stroke-width="1.5" class="flow-path"/>
  </g>

  <!-- Animated Data Packets / Pulses -->
  <circle cx="50" cy="75" r="4.5" fill="#38bdf8" filter="url(#softGlow)" class="packet-1"/>
  <circle cx="100" cy="285" r="4.5" fill="#c084fc" filter="url(#softGlow)" class="packet-2"/>
  <circle cx="50" cy="180" r="3.5" fill="#818cf8" filter="url(#softGlow)" class="packet-3"/>

  <!-- Top Decorative Category Pills (Positioned neatly at top and bottom to avoid interfering with center text) -->
  <g class="pill-item">
    <!-- Pill 1: Batch Ingestion -->
    <g transform="translate(60, 24)">
      <rect width="138" height="26" rx="13" fill="#1e293b" fill-opacity="0.8" stroke="#0284c7" stroke-width="1"/>
      <circle cx="14" cy="13" r="4" fill="#38bdf8"/>
      <text x="26" y="17" fill="#bae6fd" class="badge-text">BATCH INGESTION</text>
    </g>
    <!-- Pill 2: High Throughput -->
    <g transform="translate(210, 24)">
      <rect width="144" height="26" rx="13" fill="#1e293b" fill-opacity="0.8" stroke="#6366f1" stroke-width="1"/>
      <circle cx="14" cy="13" r="4" fill="#818cf8"/>
      <text x="26" y="17" fill="#e0e7ff" class="badge-text">HIGH THROUGHPUT</text>
    </g>
  </g>

  <g class="pill-item-alt">
    <!-- Pill 3: Bulk Data API -->
    <g transform="translate(850, 24)">
      <rect width="130" height="26" rx="13" fill="#1e293b" fill-opacity="0.8" stroke="#a855f7" stroke-width="1"/>
      <circle cx="14" cy="13" r="4" fill="#c084fc"/>
      <text x="26" y="17" fill="#f3e8ff" class="badge-text">BULK DATA APIS</text>
    </g>
    <!-- Pill 4: CDC & ELT -->
    <g transform="translate(992, 24)">
      <rect width="146" height="26" rx="13" fill="#1e293b" fill-opacity="0.8" stroke="#059669" stroke-width="1"/>
      <circle cx="14" cy="13" r="4" fill="#34d399"/>
      <text x="26" y="17" fill="#d1fae5" class="badge-text">CDC REPLICATION</text>
    </g>
  </g>

  <!-- FOREGROUND CONTENT: Header, Title, Subtitle, Highlights -->
  <!-- Guaranteed Foreground Layer - Placed cleanly in center -->
  <g transform="translate(0, 0)">
    
    <!-- Super-header / Category tag -->
    <g transform="translate(600, 105)">
      <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#1e1b4b" fill-opacity="0.9" stroke="#6366f1" stroke-width="1.2"/>
      <text x="0" y="5" text-anchor="middle" fill="#a5b4fc" class="badge-text" letter-spacing="1.5">⚡ ENTERPRISE DATA ARCHITECTURE</text>
    </g>

    <!-- Main Title (Clear Foreground, Gradient Text) -->
    <text x="600" y="165" text-anchor="middle" fill="url(#titleGrad)" class="title-text" font-size="44" filter="drop-shadow(0 2px 8px rgba(0,0,0,0.8))">
      Awesome High-Volume Bulk Data API
    </text>

    <!-- Subtitle (Clear Foreground) -->
    <text x="600" y="206" text-anchor="middle" fill="url(#subGrad)" class="body-text" font-size="17" letter-spacing="0.2">
      Curated Ecosystem of Batch Ingestion, Bulk Loading &amp; High-Throughput Replication Engines
    </text>

    <!-- Sub-tagline -->
    <text x="600" y="235" text-anchor="middle" fill="#64748b" class="body-text" font-size="14">
      SaaS Category Leaders • High-Performance Open-Source Projects • Cloud Lakehouse Gateways
    </text>
  </g>

  <!-- Bottom Metric Cards / Feature Highlights (Neatly arranged along bottom) -->
  <g transform="translate(180, 280)">
    <!-- Feature 1 -->
    <g transform="translate(0, 0)">
      <rect width="240" height="48" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
      <text x="20" y="24" fill="#38bdf8" class="badge-text">🚀 MULTI-GB/S SCALE</text>
      <text x="20" y="38" fill="#94a3b8" class="body-text" font-size="11">High-Throughput Streaming &amp; Bulk</text>
    </g>

    <!-- Feature 2 -->
    <g transform="translate(300, 0)">
      <rect width="240" height="48" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
      <text x="20" y="24" fill="#a855f7" class="badge-text">🛡️ EXACTLY-ONCE</text>
      <text x="20" y="38" fill="#94a3b8" class="body-text" font-size="11">ACID &amp; Deduplicated Delivery</text>
    </g>

    <!-- Feature 3 -->
    <g transform="translate(600, 0)">
      <rect width="240" height="48" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
      <text x="20" y="24" fill="#34d399" class="badge-text">🌐 HYBRID ECOSYSTEM</text>
      <text x="20" y="38" fill="#94a3b8" class="body-text" font-size="11">SaaS Leaders &amp; Open Source Core</text>
    </g>
  </g>

  <!-- Outer Border Frame -->
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="#334155" stroke-width="1.2" stroke-opacity="0.7"/>
</svg>
